<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Expense Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💰 Expense Tracker</h1>
      <div>
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('add_expense') }}" style="margin-left:8px;">+ Add</a>
      </div>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="card" style="border-left:4px solid #22d3ee; margin-bottom:12px;">
          {% for m in messages %}<p>{{ m }}</p>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <footer style="margin-top:20px; text-align:center; color:#9ca3af;">
      Built with ❤ using Flask + SQLite
    </footer>
  </div>
</body>
</html>
